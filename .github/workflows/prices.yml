name: Update prices

on:
  schedule:
    # 18:00 UTC on weekdays — after Xetra and Euronext have closed, all year round.
    - cron: '0 18 * * 1-5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch closing prices
        run: python scripts/fetch_prices.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json
          git diff --staged --quiet || git commit -m "prices: $(date -u +%F)"
          git push
